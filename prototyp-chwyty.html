<style>
/* VOICE: rzeczowa, sportowa – jak tablica z problemami na ściance

:root{color-scheme:dark;--bg:#111214;--panel:#1a1c1f;--line:#2d3035;--ink:#f3f2ee;--mute:#9da1a8;--acc:#ff6a2b;--btn:#25282c}
*{box-sizing:border-box;min-width:0}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100dvh;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}

@media(max-width:480px){.pl-t{display:none}}
.hbtn{flex:none;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--btn);display:flex;align-items:center;gap:8px;font-weight:600}
.hbtn svg{width:18px;height:18px}

<script>
{
const $=s=>document.querySelector(s);
const TYPES={start:{c:'#35e27f',l:'Start'},hand:{c:'#3fb6ff',l:'Ręka'},foot:{c:'#ffd23f',l:'Stopa'},top:{c:'#ff4fae',l:'Top'}};
const GRADES=['4','5','5+','6A','6A+','6B','6B+','6C','6C+','7A','7A+','7B','7B+','7C','7C+','8A','8A+'];
const MAXS=1400;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

let W=0,H=0,src=null,lab=null,dim=null,isSample=false;
let holds=[],undo=[],mode='hand',dirty=false,activeId=null;
let problems=[],cur=null;

/* ---------- obraz i przestrzeń Lab ---------- */
function setWall(cv){
  src=cv;W=cv.width;H=cv.height;
  const d=cv.getContext('2d').getImageData(0,0,W,H).data;
  const lin=new Float32Array(256);for(let i=0;i<256;i++){const v=i/255;lin[i]=v<=.04045?v/12.92:((v+.055)/1.055)**2.4}
  const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
  lab=new Float32Array(W*H*3);
  for(let i=0,j=0;i<W*H;i++,j+=4){
    const r=lin[d[j]],g=lin[d[j+1]],b=lin[d[j+2]];
    const fx=f((r*.4124+g*.3576+b*.1805)/.9505),fy=f(r*.2126+g*.7152+b*.0722),fz=f((r*.0193+g*.1192+b*.9505)/1.089);
    lab[i*3]=116*fy-16;lab[i*3+1]=500*(fx-fy);lab[i*3+2]=200*(fy-fz);
  }
  {const t=new Float32Array(lab.length);
   for(let y=0;y<H;y++)for(let x=0;x<W;x++){const xa=x>0?x-1:x,xb=x<W-1?x+1:x;for(let c=0;c<3;c++)t[(y*W+x)*3+c]=(lab[(y*W+xa)*3+c]+lab[(y*W+x)*3+c]+lab[(y*W+xb)*3+c])/3}
   for(let y=0;y<H;y++){const ya=y>0?y-1:y,yb=y<H-1?y+1:y;for(let x=0;x<W;x++)for(let c=0;c<3;c++)lab[(y*W+x)*3+c]=(t[(ya*W+x)*3+c]+t[(y*W+x)*3+c]+t[(yb*W+x)*3+c])/3}}
  dim=mk(W,H);const dc=dim.getContext('2d'),id=dc.createImageData(W,H),o=id.data;
  for(let j=0;j<d.length;j+=4){const g=d[j]*.3+d[j+1]*.59+d[j+2]*.11;
    o[j]=(d[j]*.3+g*.7)*.33;o[j+1]=(d[j+1]*.3+g*.7)*.33;o[j+2]=(d[j+2]*.3+g*.7)*.33;o[j+3]=255}
  dc.putImageData(id,0,0);
  holds=[];undo=[];activeId=null;fit();compose();
}

/* ---------- segmentacja ----------
   1) Mapa odległości geodezyjnej od miejsca tapnięcia: płynne cieniowanie chwytu kosztuje mało,
      ostre krawędzie (cień, granica chwyt–ściana/paczka) dużo.
   2) Próg dobierany automatycznie: szukamy momentu, w którym rosnący region „opiera się” o krawędź
      (plateau) albo tuż przed tym, jak wylewa się na ścianę. Wolimy mniejszy obiekt – chwyt, nie paczkę.
   3) Kontur: domknięcie, wypełnienie dziur, śledzenie brzegu i wygładzenie do krzywej. */
const GMAX=60,NOISE=1.3,STEP=.07;
function geodesic(x,y){
  const M=Math.max(W,H),R=Math.round(M*.12);
  const x0=Math.max(0,x-R),y0=Math.max(0,y-R),x1=Math.min(W-1,x+R),y1=Math.min(H-1,y+R);
  const bw=x1-x0+1,bh=y1-y0+1,N=bw*bh,D=new Float64Array(N).fill(Infinity);
  let cap=N*2+64,hk=new Float64Array(cap),hi=new Int32Array(cap),hn=0,popK=0;
  const push=(i,k)=>{if(hn>=cap){cap*=2;const a=new Float64Array(cap);a.set(hk);hk=a;const b=new Int32Array(cap);b.set(hi);hi=b}
    let c=hn++;while(c>0){const p=(c-1)>>1;if(hk[p]<=k)break;hk[c]=hk[p];hi[c]=hi[p];c=p}hk[c]=k;hi[c]=i};
  const pop=()=>{const k=hk[0],i=hi[0];hn--;if(hn>0){const lk=hk[hn],li=hi[hn];let c=0;
    for(;;){let m=c*2+1;if(m>=hn)break;if(m+1<hn&&hk[m+1]<hk[m])m++;if(hk[m]>=lk)break;hk[c]=hk[m];hi[c]=hi[m];c=m}hk[c]=lk;hi[c]=li}popK=k;return i};
  const rs=Math.max(1,Math.round(M*.002));
  for(let dy=-rs;dy<=rs;dy++)for(let dx=-rs;dx<=rs;dx++){if(dx*dx+dy*dy>rs*rs)continue;const px=x+dx,py=y+dy;if(px<x0||py<y0||px>x1||py>y1)continue;const li=(py-y0)*bw+px-x0;D[li]=0;push(li,0)}
  const cost=(ka,kb)=>{const dL=lab[ka]-lab[kb],da=lab[ka+1]-lab[kb+1],db=lab[ka+2]-lab[kb+2];const d=Math.sqrt(.8*dL*dL+da*da+db*db);return(d>NOISE?d-NOISE:0)+STEP};
  while(hn){const i=pop(),k=popK;if(k>D[i])continue;if(k>GMAX)break;
    const lx=i%bw,ly=(i/bw)|0,ka=((ly+y0)*W+lx+x0)*3;
    if(lx>0){const j=i-1,n=k+cost(ka,ka-3);if(n<D[j]){D[j]=n;push(j,n)}}
    if(lx<bw-1){const j=i+1,n=k+cost(ka,ka+3);if(n<D[j]){D[j]=n;push(j,n)}}
    if(ly>0){const j=i-bw,n=k+cost(ka,ka-W*3);if(n<D[j]){D[j]=n;push(j,n)}}
    if(ly<bh-1){const j=i+bw,n=k+cost(ka,ka+W*3);if(n<D[j]){D[j]=n;push(j,n)}}}
  // krawędź ramki (tylko boki wewnątrz zdjęcia – chwyt ucięty kadrem jest w porządku)
  let minB=Infinity;
  for(let i=0;i<bw;i++){if(y0>0)minB=Math.min(minB,D[i]);if(y1<H-1)minB=Math.min(minB,D[(bh-1)*bw+i])}
  for(let j=0;j<bh;j++){if(x0>0)minB=Math.min(minB,D[j*bw]);if(x1<W-1)minB=Math.min(minB,D[j*bw+bw-1])}
  // jeśli ramka nie dotyka krawędzi obrazu, liczy się tylko ta część ramki, która leży w obrazie — tu ramka zawsze w obrazie
  const vals=[];for(let i=0;i<N;i++)if(D[i]<=GMAX)vals.push(D[i]);
  const sorted=Float64Array.from(vals).sort();
  return {x0,y0,bw,bh,D,minB,sorted,si:(y-y0)*bw+x-x0};
}
// automatyczny próg: pierwsze „plateau” – obszar przestaje rosnąć, bo region oparł się o krawędź chwytu
function areaAt(sorted,t){let lo=0,hi=sorted.length;while(lo<hi){const m=(lo+hi)>>1;if(sorted[m]<=t)lo=m+1;else hi=m}return lo}
function autoT(g){
  const M=Math.max(W,H),minA=Math.PI*(M*.0028)**2,smallA=Math.PI*(M*.0045)**2,maxA=Math.PI*(M*.05)**2,dt=.25,Dl=1.5;

  dirty=true;compose();
}

$('#bAuto').onclick=()=>{const h=holds.find(h=>h.id===activeId);if(!h||h.t===h.ta)return;undo.push(holds);setT(h.ta)};

const modesEl=$('#modes');
modesEl.innerHTML=Object.entries(TYPES).map(([k,v])=>`<button class="mode" data-m="${k}" style="--c:${v.c}" aria-pressed="${k===mode}"><span class="dot"></span>${v.l} <span class="n" id="n-${k}">0</span></button>`).join('');
modesEl.onclick=e=>{const b=e.target.closest('.mode');if(!b)return;mode=b.dataset.m;for(const x of modesEl.children)x.setAttribute('aria-pressed',x.dataset.m===mode)};

function ui(){
  for(const k in TYPES)$('#n-'+k).textContent=holds.filter(h=>h.type===k).length;
  const p=problems.find(p=>p.id===cur);
  $('#pname').textContent=p?p.name:'Nowy problem';$('#pgrade').textContent=p?p.grade:'';
  $('#pdirty').hidden=!(dirty&&holds.length);
  $('#pcount').textContent=problems.length;
  $('#bUndo').disabled=!undo.length;$('#bClear').disabled=!holds.length;$('#bSave').disabled=!holds.length;
  $('#sampleTag').hidden=!isSample;
}

/* ---------- okna, komunikaty ---------- */
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('off');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('off'),2400)}
let hintT=setTimeout(hideHint,9000);function hideHint(){clearTimeout(hintT);$('#hint').classList.add('off')}
const open=id=>{$(id).hidden=false},close=id=>{$(id).hidden=true};
document.querySelectorAll('.sheet').forEach(sh=>{sh.addEventListener('click',e=>{if(e.target===sh||e.target.closest('[data-close]'))sh.hidden=true})});
function ask(title,text,ok){return new Promise(res=>{$('#at').textContent=title;$('#atx').textContent=text;$('#askYes').textContent=ok;open('#askSheet');
  const done=v=>{close('#askSheet');$('#askYes').onclick=$('#askNo').onclick=null;res(v)};$('#askYes').onclick=()=>done(true);$('#askNo').onclick=()=>done(false)})}

/* ---------- problemy ---------- */
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saveProblems=()=>{if(!store.set('chwyty.problems',problems))toast('Nie udało się zapisać w pamięci przeglądarki')};
$('#sGrade').innerHTML=GRADES.map(g=>`<option${g==='6A'?' selected':''}>${g}</option>`).join('');
$('#bSave').onclick=()=>{const p=problems.find(p=>p.id===cur);$('#sName').value=p?p.name:'';if(p)$('#sGrade').value=p.grade;
  $('#asNewWrap').hidden=!p;$('#sNew').checked=false;open('#saveSheet');setTimeout(()=>$('#sName').focus(),50)};
$('#saveForm').onsubmit=e=>{e.preventDefault();const name=$('#sName').value.trim()||'Bez nazwy',grade=$('#sGrade').value;
  const data=holds.map(h=>h.manual?{v:2,k:h.type,poly:h.poly}:{x:h.x,y:h.y,v:2,t:h.t===h.ta?null:h.t,k:h.type});let p=problems.find(p=>p.id===cur);
  if(!p||$('#sNew').checked){p={id:Date.now().toString(36),name,grade,holds:data};problems.push(p)}else Object.assign(p,{name,grade,holds:data});
  cur=p.id;dirty=false;saveProblems();close('#saveSheet');ui();toast('Zapisano „'+name+'”')};
function renderList(){const l=$('#plist');
  if(!problems.length){l.innerHTML='<li class="empty">Brak zapisanych problemów. Zaznacz chwyty i stuknij „Zapisz”.</li>';return}
  l.innerHTML=problems.map(p=>{const c=k=>p.holds.filter(h=>h.k===k).length;
    return `<li><button class="pl" data-id="${esc(p.id)}" aria-current="${p.id===cur}"><b>${esc(p.name)}</b><small>${p.holds.length} chwytów</small><span class="grade">${esc(p.grade)}</span></button><button class="del" data-del="${esc(p.id)}" aria-label="Usuń ${esc(p.name)}"><svg><use href="#i-x"/></svg></button></li>`}).join('')}
$('#openList').onclick=()=>{renderList();open('#listSheet')};
$('#plist').onclick=async e=>{const b=e.target.closest('.pl'),d=e.target.closest('.del');
  if(b){const p=problems.find(p=>p.id===b.dataset.id);if(!p)return;if(dirty&&holds.length&&!(await ask('Niezapisane zmiany','Bieżące zaznaczenie zostanie utracone.','Wczytaj')))return;load(p);close('#listSheet')}
  if(d){const p=problems.find(p=>p.id===d.dataset.del);if(!p)return;close('#listSheet');if(await ask('Usunąć problem?',`„${p.name}” zostanie usunięty.`,'Usuń')){problems=problems.filter(x=>x!==p);if(cur===p.id)cur=null;saveProblems();ui()}renderList();open('#listSheet')}};
$('#bNew').onclick=()=>{undo.push(holds);holds=[];setActive(null);cur=null;dirty=false;close('#listSheet');compose()};
function load(p){holds=p.holds.map(o=>o.poly?makeManual(o.poly,o.k):makeHold(o.x,o.y,o.k,o.v===2?o.t:null)).filter(Boolean);undo=[];setActive(null);cur=p.id;dirty=false;compose()}

/* ---------- zdjęcie ---------- */
async function pick(f){
  if(!f)return;
  if(!isSample&&problems.length&&!(await ask('Nowa ścianka?',`Nowe zdjęcie zastąpi obecną ściankę i jej ${problems.length} zapisane problemy.`,'Zastąp')))return;
  toast('Przetwarzam zdjęcie…');
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>setTimeout(()=>{const k=Math.min(1,MAXS/Math.max(im.naturalWidth,im.naturalHeight)),c=mk(Math.round(im.naturalWidth*k),Math.round(im.naturalHeight*k));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    isSample=false;problems=[];cur=null;dirty=false;setWall(c);saveProblems();
    if(!store.set('chwyty.wall',c.toDataURL('image/jpeg',.85)))toast('Zdjęcie działa, ale nie zmieściło się w pamięci przeglądarki');else toast('Gotowe – tapnij chwyty');},30);
  im.onerror=()=>toast('Nie udało się wczytać zdjęcia');im.src=url;
}
$('#bCam').onclick=()=>$('#fCam').click();$('#bGal').onclick=()=>$('#fGal').click();
$('#fCam').onchange=e=>{pick(e.target.files[0]);e.target.value=''};$('#fGal').onchange=e=>{pick(e.target.files[0]);e.target.value=''};

/* ---------- przykładowa ścianka ---------- */
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function drawHold(x,cx,cy,R,col,r){
  const n=14,ph=r()*6.3,p=[];for(let i=0;i<n;i++){const a=i/n*6.283,k=.8+.18*Math.sin(a*2+ph)+r()*.1;p.push([cx+Math.cos(a)*R*k*1.15,cy+Math.sin(a)*R*k*.9])}
  const path=()=>{x.beginPath();for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n],m=[(a[0]+b[0])/2,(a[1]+b[1])/2];i?x.quadraticCurveTo(a[0],a[1],m[0],m[1]):x.moveTo(m[0],m[1])}x.quadraticCurveTo(p[0][0],p[0][1],(p[0][0]+p[1][0])/2,(p[0][1]+p[1][1])/2);x.closePath()};
  x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=R*.45;x.shadowOffsetY=R*.22;x.fillStyle=col;path();x.fill();x.restore();
  const g=x.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R*1.2);g.addColorStop(0,'rgba(255,255,255,.2)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.2)');x.fillStyle=g;path();x.fill();
  x.fillStyle='rgba(25,25,25,.85)';x.beginPath();x.arc(cx+R*.1,cy,Math.max(3,R*.12),0,7);x.fill();
}
function sampleWall(){
  const c=mk(1200,900),x=c.getContext('2d'),r=rng(11);
  for(let i=0;i<4;i++)for(let j=0;j<3;j++){x.fillStyle=`hsl(36 9% ${73+r()*7}%)`;x.fillRect(i*300,j*300,300,300)}
  const g=x.createLinearGradient(0,0,0,900);g.addColorStop(0,'rgba(255,255,255,.1)');g.addColorStop(1,'rgba(0,0,0,.2)');x.fillStyle=g;x.fillRect(0,0,1200,900);
  x.strokeStyle='rgba(0,0,0,.28)';x.lineWidth=2;x.beginPath();for(let i=300;i<1200;i+=300){x.moveTo(i,0);x.lineTo(i,900)}for(let j=300;j<900;j+=300){x.moveTo(0,j);x.lineTo(1200,j)}x.stroke();
  x.fillStyle='rgba(45,42,38,.55)';for(let i=18.75;i<1200;i+=37.5)for(let j=18.75;j<900;j+=37.5){x.beginPath();x.arc(i,j,3,0,7);x.fill()}
  const BL='#2463d6',OR='#f07a16';
  const blue=[[600,820,30],[700,700,32],[560,600,28],[665,480,36],[545,360,30],[650,240,32],[595,100,42],[510,860,17],[735,790,16]];
  const orng=[[110,600,32],[250,560,27],[390,630,34],[860,590,30],[990,545,27],[1110,610,34],[170,740,16],[930,720,16]];
  // paczka (volume) z małymi stopniami w tym samym kolorze
  const VC='#3d9b8e',vol=[[880,90],[1150,60],[1170,330],[960,400]];
  x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=30;x.shadowOffsetY=14;x.fillStyle=VC;x.beginPath();vol.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill();x.restore();
  const vg=x.createLinearGradient(880,60,1170,400);vg.addColorStop(0,'rgba(255,255,255,.16)');vg.addColorStop(1,'rgba(0,0,0,.22)');x.fillStyle=vg;x.beginPath();vol.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill();
  x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=3;x.beginPath();x.moveTo(1150,60);x.lineTo(960,400);x.stroke();
  const steps=[[990,170,15],[1080,250,13],[1060,130,12]];
  for(const [a,b,rr] of steps)drawHold(x,a,b,rr,'#56b8a9',r);
  const placed=[...blue,...orng,[1020,230,170]].map(([a,b,rr])=>[a,b,rr]);
  const others=['#d8262f','#2f9e44','#f2c514','#7a3fb8','#1f1f22','#f4f1ea','#e04b9a','#14a7b8'];
  const rest=[];for(let k=0;k<400&&rest.length<34;k++){const rr=16+r()*26,a=40+r()*1120,b=40+r()*820;if(placed.every(([px,py,pr])=>Math.hypot(px-a,py-b)>pr+rr+22)){placed.push([a,b,rr]);rest.push([a,b,rr,others[(r()*others.length)|0]])}}
  for(const [a,b,rr,col] of rest)drawHold(x,a,b,rr,col,r);
  for(const [a,b,rr] of blue)drawHold(x,a,b,rr,BL,r);
  for(const [a,b,rr] of orng)drawHold(x,a,b,rr,OR,r);
  const P=(name,grade,list,types)=>({id:name,name,grade,holds:list.map(([a,b],i)=>({x:a,y:b,v:2,t:null,k:types[i]}))});
  return {c,probs:[
    P('Niebieska rysa','6A+',blue,['start','start','hand','hand','hand','hand','top','foot','foot']),
    P('Pomarańczowy trawers','5+',orng,['start','hand','hand','hand','hand','top','foot','foot'])]};
}

/* ---------- start ---------- */
function boot(){
  resize();
  const saved=store.get('chwyty.wall');
  const fallback=()=>{const sw=sampleWall();isSample=true;problems=sw.probs;setWall(sw.c);load(problems[0])};
  if(typeof saved==='string'&&saved.startsWith('data:image')){
    const im=new Image();im.onload=()=>{const c=mk(im.naturalWidth,im.naturalHeight);c.getContext('2d').drawImage(im,0,0);isSample=false;problems=store.get('chwyty.problems')||[];setWall(c)};
    im.onerror=fallback;im.src=saved;
  }else fallback();
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot,boot);
}
</script>
